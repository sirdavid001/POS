name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
          POSTGRES_DB: pos_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for tracked secrets
        run: ./scripts/check-no-secrets.sh

      - name: Lint source
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build client
        run: npm run build -w packages/client

      - name: Build website
        run: npm run build -w packages/website

      - name: Run migrations
        run: npm run db:migrate -w packages/server
        env:
          DATABASE_URL: postgresql://pos_user:pos_password@localhost:5432/pos_db

      - name: Run seed
        run: npm run db:seed -w packages/server
        env:
          DATABASE_URL: postgresql://pos_user:pos_password@localhost:5432/pos_db

      - name: Run tests
        run: npm test --if-present
        env:
          DATABASE_URL: postgresql://pos_user:pos_password@localhost:5432/pos_db
          JWT_SECRET: test-secret
